# cargo-deny configuration. Run: cargo deny check
# Inventory and rationale: docs/LICENSES-INVENTORY.md

[graph]
all-features = false
features = ["ffi", "system-opener"]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
]

[licenses]
# Permissive licenses plus MPL-2.0 (file-level copyleft; notice obligations
# documented). GPL/AGPL/LGPL are deliberately NOT allowed.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
]
confidence-threshold = 0.9

# Our own crates (publish = false) use `license-file = "LICENSE"` (CC0 1.0
# with MIT fallback) and are skipped here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
  # The opener must not go through `open` (PowerShell/explorer/fallback chain).
  { crate = "open", reason = "use voidwire_core::opener::SystemOpener (direct ShellExecuteW / xdg-open / open)" },
  # Never expose shell/opener capabilities to the webview (AUTH-13).
  { crate = "tauri-plugin-opener", reason = "AUTH-13: no opener plugin" },
  { crate = "tauri-plugin-shell", reason = "AUTH-13: no shell plugin" },
]

[advisories]
ignore = [
  # proc-macro-error: unmaintained, build-time only (gtk3-macros via Tauri's
  # Linux webview stack). No runtime code. Revisit when Tauri moves to gtk4.
  { id = "RUSTSEC-2024-0370", reason = "build-time proc macro via gtk-rs 0.18 (Tauri Linux); unmaintained, not vulnerable" },
  # paste: unmaintained (archived), proc macro only, via iroh -> netwatch ->
  # netlink-packet-core (M1 LAN transport). No runtime code, not vulnerable.
  { id = "RUSTSEC-2024-0436", reason = "build-time proc macro via iroh/netwatch netlink crates; unmaintained, not vulnerable" },
  # basic-toml: unmaintained (archived), build-time proc macro via uniffi_bindgen
  # 0.29 -> askama_derive. No runtime code, not vulnerable.
  { id = "RUSTSEC-2026-0374", reason = "build-time proc macro via uniffi_bindgen 0.29 / askama_derive; unmaintained, not vulnerable" },
  # zvariant / zbus_names / zvariant_derive: standalone crates folded into zbus
  # 6.0; pulled in by tauri-plugin-single-instance 2.5 -> zbus 5.19 on Linux.
  # Unmaintained standalone notice only, not vulnerable.
  { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6.0; transitive via tauri-plugin-single-instance 2.5 -> zbus 5.19; unmaintained, not vulnerable" },
  { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6.0; transitive via tauri-plugin-single-instance 2.5 -> zbus 5.19; unmaintained, not vulnerable" },
  { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6.0; transitive via tauri-plugin-single-instance 2.5 -> zbus 5.19; unmaintained, not vulnerable" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
