[workspace]
resolver = "2"
members = ["core", "desktop", "desktop/os-theme", "mailbox", "push-gw", "tools/uniffi-bindgen"]
default-members = ["core", "desktop", "desktop/os-theme", "mailbox", "push-gw"]
exclude = ["tools/relay-bench"]

[workspace.package]
version = "0.8.1"
edition = "2021"
rust-version = "1.91"
# First-party license (CC0 1.0 with MIT fallback). Deliberately a file, not an SPDX id.
license-file = "LICENSE"
# No `repository` here: the repo URL is branding (REPO_URL in branding.properties).
publish = false

[workspace.dependencies]
uniffi = { version = "0.29" }
thiserror = "2"

# Dev profile (local builds and tests). Since M1 the artifacts are release-profile
# builds (HPKE landed, see core/src/envelope.rs). No debuginfo, light optimization
# for dependencies. debug_assertions stay on.
[profile.dev]
debug = false
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
# Android: scripts/build-android.sh overrides this to "unwind" (CARGO_PROFILE_RELEASE_PANIC)
# so a Rust panic becomes a Kotlin exception at the UniFFI boundary (QA C1).
