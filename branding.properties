# Single source of truth for the product's public identity.
# Product identity: Voidwire (domain voidwire.app).
# Renaming = edit these lines. See README.md "Renaming" for what reads each key.
# NOT here on purpose: the protocol name `voidwire` (QR scheme, signature/hash
# domain tags, wire magic) is fixed forever and never follows branding (D9;
# core/src/protocol.rs, docs/PROTOCOL.md §1.1).

# Human-visible app name (tray tooltip, window titles, Android launcher label, installer name)
APP_NAME=Voidwire
# Desktop bundle identifier (Tauri `identifier`: Windows/macOS/Linux bundles)
BUNDLE_ID=app.voidwire.desktop
# iOS bundle ID prefix, RESERVED for M6 (app = IOS_BUNDLE_PREFIX, extensions =
# IOS_BUNDLE_PREFIX.share / .notification). Not read by any build yet.
IOS_BUNDLE_PREFIX=app.voidwire.ios
# Product domain (landing page, future support/contact addresses). Not read by any build yet.
DOMAIN=voidwire.app
# Android package ID (Gradle `applicationId`)
PACKAGE_ID=app.voidwire.android
# Desktop executable name (Tauri `mainBinaryName`: /usr/bin/<name>, .desktop Exec/Icon, <name>.exe in the installer)
BINARY_NAME=voidwire
# Prefix for every environment variable the apps/services read (e.g. <PREFIX>_PUSH_GW_ADDR)
ENV_PREFIX=VOIDWIRE
# Project/support URL (Tauri `bundle.homepage`: deb Homepage, installer links)
REPO_URL=https://github.com/voidwire-app/voidwire
# Publisher (Tauri `bundle.publisher`: deb Maintainer field, Windows installer Publisher). Debian wants "Name <email>".
PUBLISHER=Voidwire <maintainer@voidwire.app>
