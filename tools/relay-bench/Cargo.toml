[package]
name = "relay-bench"
version = "0.0.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"
description = "M4.1 relay supervisor and background-check measurement harness (CI only, not shipped)."

# Standalone: keeps the iroh relay server (test-only) out of the app's lockfile.
[workspace]

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "test-utils"] }
iroh-relay = { version = "1.3", default-features = false, features = ["tls-ring", "test-utils", "server"] }
tokio = { version = "1", features = ["full"] }
voidwire-core = { path = "../../core", features = ["net", "test-util"] }
anyhow = "1"

[profile.dev]
debug = false
[profile.dev.package."*"]
opt-level = 1
