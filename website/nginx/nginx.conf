# voidwire.app static site. Runs as the image's unprivileged user (uid 101)
# on a read-only root filesystem; only /tmp must be writable (tmpfs).
# Privacy: no access log anywhere, error log to stderr at "crit" only, so
# visitor IPs, paths and user agents are never written.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr crit;

events {
    worker_connections 1024;
}

http {
    access_log off;
    log_not_found off;
    log_subrequest off;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # Cache policy by type: pages and security.txt revalidate every time;
    # CSS/JS (fixed names, changed by a redeploy) a day; fonts and images a week.
    map $sent_http_content_type $cache_control {
        default                 "no-cache";
        ~^text/css              "public, max-age=86400";
        ~^application/javascript "public, max-age=86400";
        ~^font/                 "public, max-age=604800, immutable";
        ~^image/                "public, max-age=604800";
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /srv/site;
        index index.html;

        absolute_redirect off;
        port_in_redirect off;
        etag on;

        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $cache_control always;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        # Clean URLs: /privacy serves privacy.html; /privacy.html stays valid
        # because every page links with .html.
        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        location = /.well-known/security.txt {
            default_type text/plain;
            try_files $uri =404;
        }

        # Nothing that starts with a dot or underscore is served (defence in
        # depth: the build already leaves _later-* and previews out).
        location ~ (^|/)\.(?!well-known/) { return 404; }
        location ~ (^|/)_ { return 404; }

        error_page 404 /404.html;
        error_page 405 /404.html;
        location = /404.html { internal; }
    }
}
