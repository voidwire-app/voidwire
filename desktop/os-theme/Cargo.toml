[package]
name = "voidwire-os-theme"
description = "Taskbar theme + DPI queries + current-user IPC + OS integrations for the desktop tray app (keeps the tray app itself free of unsafe code)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# M5.1: X11 global send-clipboard shortcut (XGrabKey). Pure-Rust protocol,
# no default features (no libxcb link, no dlopen).
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", default-features = false }
# M5.1 L3: the Wayland GlobalShortcuts portal over D-Bus. Pure Rust; already
# in the build (tauri-plugin-single-instance), so no new crates.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# GNOME custom keybinding (GSettings, in process). Already in the build
# through tauri/gtk (same version), so no new crates.
gio = "0.18"

# M5.2: AppKit / Foundation bindings, already in the build through tauri
# and wry (same versions), so no new crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDistributedNotificationCenter", "NSEnumerator", "NSNotification", "NSObject", "NSOperation", "NSString", "NSURL", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSView", "NSWindow"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Tests only: synthetic key presses for the X11 shortcut test.
x11rb = { version = "0.14", default-features = false, features = ["xtest"] }
