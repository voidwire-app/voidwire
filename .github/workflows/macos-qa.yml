name: macos-qa

# M5.2 groundwork: macOS desktop build and unit tests. Manual only, to keep
# macOS runner minutes low (no schedule, no push or PR trigger):
#   gh workflow run macos-qa.yml --ref master
# 1. clippy (-D warnings) and the Rust unit/integration tests on Apple silicon.
# 2. An x86_64 type-check (cargo check), so Intel breaks show up without a
#    second full build.
# 3. An UNSIGNED .app bundle (arm64), uploaded for 3 days. Not notarized:
#    Gatekeeper will refuse to open it on a normal Mac. It is a build check,
#    not something to hand to users.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: build + test on macos-latest (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: macos-qa
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p voidwire-core --features ffi,system-opener --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: x86_64 type-check (desktop, os-theme, core)
        run: cargo check --target x86_64-apple-darwin -p voidwire-desktop -p voidwire-os-theme -p voidwire-core --all-targets
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: tauri-cli@2,cargo-about
      - name: Unsigned .app (arm64)
        env:
          VOIDWIRE_SHIPPING_BUILD: "1"
        run: |
          python3 scripts/tauri-dist-config.py build/tauri-dist.json
          cd desktop
          cargo tauri build --config ../build/tauri-dist.json --bundles app
      - name: Bundle facts
        run: |
          app=$(ls -d target/release/bundle/macos/*.app | head -1)
          echo "app: $app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist" || true
          lipo -archs "$app"/Contents/MacOS/*
          codesign -dv "$app" 2>&1 || echo "not signed (expected)"
          ditto -c -k --keepParent "$app" "target/release/bundle/macos/voidwire-macos-arm64-unsigned.app.zip"
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: macos-unsigned-app
          retention-days: 3
          path: target/release/bundle/macos/*.app.zip
