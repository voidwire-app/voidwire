# Every green ci run that built installers publishes a GitHub release
# (a full release for a plain vX.Y.Z tag, otherwise a pre-release)
# with the Windows NSIS installer, Linux bundles, the macOS disk image and
# .app.tar.gz (M5.2, beta), self-host relay bundles
# (systemd files, and on v* tags the Docker compose bundle),
# the Android APK and THIRD-PARTY-LICENSES.txt. Since M1.1 that is a v* tag push (released under that tag)
# or a manual dispatch of ci (released as m1-test-<sha>); plain pushes to
# master build no installer.
#
# Minutes: this workflow does NOT rebuild. It takes the exact artifacts the
# triggering ci run built and gated (desktop-Windows and desktop-macOS from desktop-bundles,
# android-apk from android, which ran scripts/gates.sh --artifacts on it).
#
# Release-profile builds (HPKE envelope landed in M1). Links open immediately by
# default; 'Ask before opening' is an optional desktop setting. Signing keys
# live in GitHub Actions secrets only, never on the build box.
#
# Update channels (U1, docs/UPDATES.md), v* tags only: the test channel
# manifest is written, signed with the CI test key (secret
# VOIDWIRE_UPDATE_TEST_KEY) and published to GitHub Pages. For a stable
# version (no "-" in the version) the stable manifest is written UNSIGNED and
# attached to the release; it goes live only through publish-stable-update.yml
# with a signature made offline.
name: prerelease

on:
  workflow_run:
    # Only the workflow named "ci". windows-qa (and any other workflow) must
    # never publish; the job's if also pins the source file path.
    workflows: [ci]
    branches: [master, "v*"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.path == '.github/workflows/ci.yml' &&
          github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'workflow_dispatch' ||
           (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))) }}
    runs-on: ubuntu-24.04
    outputs:
      pages: ${{ steps.update.outputs.pages }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v7.0.0
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Collect installer, Linux bundles, self-host relay bundle + APK
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*-setup.exe' -o -name '*.apk' -o -name '*.deb' -o -name '*.AppImage' -o -name 'voidwire-mailbox-linux-x86_64' -o -name 'voidwire-relay-selfhost.tar.gz' -o -name 'voidwire-extension-chromium.zip' -o -name 'voidwire-extension-firefox.zip' -o -name 'voidwire-sign-linux-x86_64' -o -name 'voidwire-sign-windows-x86_64.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' \) -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist/*-setup.exe)" && test -n "$(ls dist/*.apk)" && test -n "$(ls dist/*.deb)" && test -n "$(ls dist/*.AppImage)" && test -f dist/voidwire-mailbox-linux-x86_64 && test -f dist/voidwire-relay-selfhost.tar.gz && test -f dist/voidwire-extension-chromium.zip && test -f dist/voidwire-extension-firefox.zip && test -f dist/voidwire-sign-linux-x86_64 && test -f dist/voidwire-sign-windows-x86_64.exe && test -n "$(ls dist/*.dmg)" && test -n "$(ls dist/*.app.tar.gz)"
      # Every download gets Voidwire_<version>_<platform> (version = versionName,
      # the tag without "v"), so links are predictable. Operator tools keep
      # fixed names. The table is in scripts/release_assets.py; the update
      # manifest reads the same table.
      - name: Versioned file names
        run: |
          python3 scripts/release_assets.py rename --dist dist
          ls -l dist
      # Docker relay bundle (v* tags): compose.yml pinned to this version's
      # ghcr.io/voidwire-app/voidwire-mailbox image (pushed by relay-image.yml)
      # plus config templates. See docs/self-host-relay.md section 5.
      - name: Docker relay bundle
        if: ${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: scripts/relay-docker-bundle.sh "${HEAD_BRANCH#v}" dist
      # One THIRD-PARTY-LICENSES.txt for every published file (D8): the
      # desktop crates, then the Android crates and Java/Kotlin libraries, both
      # generated by scripts/gen-third-party.py in the ci run.
      - name: THIRD-PARTY-LICENSES.txt
        run: |
          desk=$(find artifacts/desktop-Linux -name THIRD-PARTY-LICENSES.txt | head -1)
          andr=$(find artifacts/android-third-party-licenses -name THIRD-PARTY-LICENSES.txt | head -1)
          test -s "$desk" && test -s "$andr"
          { echo "==== Desktop app, self-host relay and browser extension ===="; echo; cat "$desk"; echo; echo "==== Android app ===="; echo; cat "$andr"; } > dist/THIRD-PARTY-LICENSES.txt
          wc -l dist/THIRD-PARTY-LICENSES.txt
      # Re-scan exactly what gets published (installer + APK) for test-harness code.
      - name: No test-harness code in the published files
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep p7zip-full squashfs-tools unzip
          scripts/gates.sh --artifacts
      # Checksums last, over exactly the scanned files.
      - name: SHA256SUMS
        run: |
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # A plain vX.Y.Z tag is a full release and becomes "latest" (the website
      # and releases/latest link to it). A tag with a "-" (v0.9.8-m5.1,
      # v1.0.0-rc1) stays a pre-release and never becomes "latest".
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$HEAD_BRANCH" == v* ]]; then
            TAG="$HEAD_BRANCH"
            if [[ "$TAG" == *-* ]]; then
              TITLE="Voidwire $TAG (pre-release)"
              NOTES="Voidwire $TAG pre-release build ($HEAD_SHA)."
              KIND=(--prerelease --latest=false)
            else
              TITLE="Voidwire $TAG"
              NOTES="Voidwire $TAG ($HEAD_SHA)."
              # Hand-written notes for a stable release, if committed.
              if [[ -s "docs/release-notes/$TAG.md" ]]; then
                NOTES="$(cat "docs/release-notes/$TAG.md")"$'\n\n'"Built from $HEAD_SHA."
              fi
              KIND=(--prerelease=false --latest)
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" "${KIND[@]}"
            else
              # Omit --target for existing v* tags so GitHub attaches to refs/tags/$TAG
              # without attempting a ref write on commits that touch .github/workflows/.
              gh release create "$TAG" dist/* \
                --title "$TITLE" \
                "${KIND[@]}" \
                --notes "$NOTES"
            fi
          else
            TAG="m1-test-$HEAD_SHA"
            TITLE="Test build (unsigned installer) $HEAD_SHA"
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/* --clobber
            else
              gh release create "$TAG" dist/* \
                --target "$HEAD_SHA" \
                --title "$TITLE" \
                --prerelease \
                --notes "Voidwire test build ($HEAD_SHA)."
            fi
          fi
      # U1 update channels (v* tags). The manifests point at the assets just
      # published under this tag; hashes come from the SHA256SUMS above.
      - name: Update manifests (test signed in CI, stable unsigned)
        id: update
        if: ${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          VOIDWIRE_UPDATE_TEST_KEY: ${{ secrets.VOIDWIRE_UPDATE_TEST_KEY }}
        run: |
          set -euo pipefail
          sign=dist/voidwire-sign-linux-x86_64
          chmod +x "$sign"
          mkdir -p update site/update/v1
          python3 scripts/update-manifest.py --channel test --tag "$TAG" --repo "$GITHUB_REPOSITORY" --out update/voidwire-update-test.json
          "$sign" sign --key-env VOIDWIRE_UPDATE_TEST_KEY update/voidwire-update-test.json
          "$sign" verify --channel test update/voidwire-update-test.json
          upload=(update/voidwire-update-test.json update/voidwire-update-test.json.sig)
          if [[ "$TAG" != *-* ]]; then
            python3 scripts/update-manifest.py --channel stable --tag "$TAG" --repo "$GITHUB_REPOSITORY" --out update/voidwire-update-stable.json
            upload+=(update/voidwire-update-stable.json)
          fi
          gh release upload "$TAG" "${upload[@]}" --clobber
          # Keep the stable channel's live files; replace the test channel's.
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/update/v1"
          for f in stable.json stable.json.sig; do
            curl -fsSL "$base/$f?t=$(date +%s)" -o "site/update/v1/$f" || rm -f "site/update/v1/$f"
          done
          cp update/voidwire-update-test.json site/update/v1/test.json
          cp update/voidwire-update-test.json.sig site/update/v1/test.json.sig
          ls -l site/update/v1
          echo "pages=true" >> "$GITHUB_OUTPUT"
      - name: Stable manifest to sign offline
        if: ${{ startsWith(github.event.workflow_run.head_branch, 'v') && !contains(github.event.workflow_run.head_branch, '-') }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: update-stable-unsigned
          path: update/voidwire-update-stable.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5.0.0
        if: ${{ steps.update.outputs.pages == 'true' }}
        with:
          path: site

  pages:
    needs: publish
    if: ${{ needs.publish.outputs.pages == 'true' }}
    runs-on: ubuntu-24.04
    # One Pages deploy at a time (this workflow and publish-stable-update.yml).
    concurrency:
      group: update-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
