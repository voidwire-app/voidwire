# CI: build + test on Linux and Windows, plus Android APK and policy gates.
#
# macOS builds are currently disabled and will be enabled together with Apple
# Developer ID signing and notarization.
# (Removed: macos-latest from the rust matrix and the app,dmg desktop bundle.
# To re-enable, add macos-latest back to rust.matrix.os and the
# {os: macos-latest, bundles: app,dmg} entry to desktop-bundles, plus
# '*.dmg' to its artifact paths.)
#
# Minutes: the desktop bundle jobs (release builds + installers) run only on
# version tags (v*) and manual dispatch; rust, android, gates and deny run on
# every push/PR to master. Tag pushes skip the redundant `rust` test matrix so
# Windows/Linux aren't compiled twice on release tags. Docs-only pushes skip
# this workflow entirely (paths-ignore); a newer push to the same ref cancels
# the in-flight run (concurrency). Cargo and Gradle are cached.
name: ci

on:
  push:
    branches: [master]
    # Path filters are not evaluated for tag pushes: a v* tag always runs.
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "brand/**"
      - ".gitignore"
  pull_request:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "brand/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    # Tag pushes build release installers in desktop-bundles directly after gates;
    # skip the redundant test matrix on v* tags so Windows/Linux aren't compiled twice.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
          # Run windows-latest on PRs and manual dispatch; skip on intermediate branch pushes to save 2x Windows minutes when private/forked.
        exclude:
          - os: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) && 'windows-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libgtk-3-dev patchelf
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p voidwire-core --features ffi,system-opener --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --no-fail-fast
      - name: test core with FFI scaffolding
        run: cargo test -p voidwire-core --features ffi --no-fail-fast

  gates:
    name: security gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # scripts/gates.sh fails closed (D3): refusal gates only pass on their
      # specific compile_error text; greps cover aliases/absolute paths (D4).
      - name: Security gates (banned crates, clock reads, shell/spawn, release gates, compile-fail probes)
        run: scripts/gates.sh

  deny:
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  desktop-bundles:
    name: desktop bundle (${{ matrix.os }})
    needs: [rust, gates]
    # Installers only for version tags and manual runs (saves ~45 min/push).
    if: always() && needs.gates.result == 'success' && (needs.rust.result == 'success' || needs.rust.result == 'skipped') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libgtk-3-dev patchelf
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: tauri-cli@2,cargo-about
      - name: Build (release profile; HPKE landed in M1)
        shell: bash
        env:
          VOIDWIRE_SHIPPING_BUILD: "1"
        run: |
          python3 scripts/tauri-dist-config.py build/tauri-dist.json
          cd desktop
          cargo tauri build --config ../build/tauri-dist.json --bundles ${{ matrix.bundles }}
          cd ..
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo build --release -p voidwire-mailbox
            mkdir -p target/release/bundle/relay target/release/bundle/extension
            cp target/release/voidwire-mailbox target/release/bundle/relay/voidwire-mailbox-linux-x86_64
            tar -czf target/release/bundle/relay/voidwire-relay-selfhost.tar.gz -C ops/relay .
            scripts/build-extension.sh target/release/bundle/extension
          fi
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: desktop-${{ runner.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*-setup.exe
            target/release/bundle/relay/voidwire-mailbox-linux-x86_64
            target/release/bundle/relay/voidwire-relay-selfhost.tar.gz
            target/release/bundle/extension/voidwire-extension-chromium.zip
            target/release/bundle/extension/voidwire-extension-firefox.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # v3 asked sdkmanager for the removed 'tools' package and failed (run 38119857136).
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: NDK
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: cargo-ndk,cargo-about
      # Includes the Android license gate (D12, scripts/check-android-licenses.py)
      # and THIRD-PARTY-LICENSES.txt generation (D8).
      - name: Build APK + license gate + JVM unit tests
        env:
          VOIDWIRE_ANDROID_KEYSTORE_BASE64: ${{ secrets.VOIDWIRE_ANDROID_KEYSTORE_BASE64 }}
          VOIDWIRE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VOIDWIRE_ANDROID_KEYSTORE_PASSWORD }}
          VOIDWIRE_ANDROID_KEY_ALIAS: ${{ secrets.VOIDWIRE_ANDROID_KEY_ALIAS }}
        run: scripts/build-android.sh
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
      - name: No test-harness code in the APK
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep p7zip-full squashfs-tools unzip
          scripts/gates.sh --artifacts
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: android-license-report
          path: android/app/build/reports/dependency-license/
