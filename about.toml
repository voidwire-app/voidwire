# cargo-about config for THIRD-PARTY-LICENSES (D8). Keep `accepted` in sync
# with deny.toml [licenses].allow (cargo-deny is the enforcing gate).
accepted = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0",
  "Unlicense", "BSL-1.0", "MPL-2.0", "CDLA-Permissive-2.0", "0BSD",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
private = { ignore = true }

# The packaged LICENSE carries the real BSD-3-Clause copyright lines; without
# this cargo-about falls back to the SPDX template text.
[curve25519-dalek.clarify]
license = "BSD-3-Clause"
[[curve25519-dalek.clarify.files]]
path = "LICENSE"
license = "BSD-3-Clause"
checksum = "cca0bd3c4fcdba74145ef9d49c62337e2c9fbf9368288f11d0547f1b0273219f"
