# Voidwire relay, iroh-relay 1.3.0. Keys verified against iroh-relay/src/main.rs (Config, TlsConfig, Limits).
enable_relay = true
http_bind_addr = "127.0.0.1:80"       # always bound when [tls] is set; captive portal only; NOT public (§3.2)

# QUIC address discovery on UDP 7842 (default is false; needs [tls]).
enable_quic_addr_discovery = true

# Metrics: aggregate counters only, localhost only (default would be [::]:9090, public).
enable_metrics = true
metrics_bind_addr = "127.0.0.1:9090"

# Anyone may relay (endpoints authenticate end to end; our app only talks to paired devices).
access = "everyone"
# Only devices with your relay link (see docs/self-host-relay.md §4):
# access.shared_token = ["output-of-voidwire-mailbox---gen-token"]

[tls]
https_bind_addr = "[::]:443"
quic_bind_addr = "[::]:7842"
hostname = "relay.example.com"
cert_mode = "LetsEncrypt"             # built-in ACME (tokio-rustls-acme 0.9): TLS-ALPN-01 on 443 only, no port 80 (§3.1)
cert_dir = "/var/lib/iroh-relay/certs"
contact = "relay-admin@example.com"
prod_tls = true

[limits]
accept_conn_limit = 50.0              # new connections/s, whole server
accept_conn_burst = 200

[limits.client.rx]
bytes_per_second = 65536              # per client; a URL envelope is <= 8448 B
max_burst_bytes = 262144
