# Voidwire relay + mailbox from published images. Linux host networking.
# Setup, the access token and upgrades: docs/self-host-relay.md, section 5.
#
#   .env      your settings (cp .env.example .env): public name, TLS mode,
#             contact, UDP, access, size and speed limits. Never the token.
#   config/   relay-token (created on first start), relay-link.txt (the link
#             for the apps, rewritten on every start); optional relay.toml and
#             mailbox.toml to control every setting (they win over .env)
#   data/     created on every start: generated configs, mailbox ID key,
#             relay certificates
#
# Edit .env, then:  docker compose up -d
# Relay link:  cat config/relay-link.txt  (rewritten on every start)
#
# Put your own changes (such as extra_hosts) in compose.override.yml, not
# here: this file is replaced on upgrade. See compose.override.example.yml.
# Release bundles (voidwire-relay-docker.tar.gz) pin the mailbox image to
# that release. In a repository checkout the tag below is a placeholder:
# build the image instead with compose.build.yml.
services:
  # One-shot, every start: builds data/relay/relay.toml and
  # data/mailbox/mailbox.toml (from config/*.toml if present, else from
  # .env), creates config/relay-token if needed, writes config/relay-link.txt
  # and sets data/ ownership.
  setup:
    image: ghcr.io/voidwire-app/voidwire-mailbox:unreleased
    entrypoint: ["/usr/local/bin/voidwire-relay-setup"]
    command: []
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"
    # Non-secret settings only. The token never goes in the environment.
    environment:
      VOIDWIRE_RELAY_HOSTNAME: ${VOIDWIRE_RELAY_HOSTNAME:-}
      VOIDWIRE_RELAY_MODE: ${VOIDWIRE_RELAY_MODE:-tls}
      VOIDWIRE_RELAY_CONTACT: ${VOIDWIRE_RELAY_CONTACT:-}
      VOIDWIRE_RELAY_UDP: ${VOIDWIRE_RELAY_UDP:-true}
      VOIDWIRE_RELAY_ACCESS: ${VOIDWIRE_RELAY_ACCESS:-token}
      VOIDWIRE_RELAY_PROXY_BIND: ${VOIDWIRE_RELAY_PROXY_BIND:-127.0.0.1:3340}
      # Tuning; empty = the shipped default (see .env.example).
      VOIDWIRE_RELAY_FILE_LIMIT_MB: ${VOIDWIRE_RELAY_FILE_LIMIT_MB:-}
      VOIDWIRE_RELAY_DEVICE_RATE_KB: ${VOIDWIRE_RELAY_DEVICE_RATE_KB:-}
      VOIDWIRE_RELAY_NEW_CONN_PER_SEC: ${VOIDWIRE_RELAY_NEW_CONN_PER_SEC:-}
      VOIDWIRE_RELAY_INBOX_ITEMS: ${VOIDWIRE_RELAY_INBOX_ITEMS:-}
      VOIDWIRE_RELAY_INBOX_MINUTES: ${VOIDWIRE_RELAY_INBOX_MINUTES:-}
      VOIDWIRE_RELAY_INBOX_RAM_MB: ${VOIDWIRE_RELAY_INBOX_RAM_MB:-}
    volumes:
      - ./config:/config
      - ./data:/data
    logging:
      driver: none

  relay:
    # iroh project image, pinned by digest (amd64 + arm64).
    image: n0computer/iroh-relay:v1.3.0@sha256:7a51e3826531dba5eee73d8b48a8f27284684d98c4d0da271d99127cc43b9d57
    command: ["--config-path", "/data/relay.toml"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      RUST_LOG: "off"
    volumes:
      - ./data/relay:/data
    logging:
      driver: none

  mailbox:
    image: ghcr.io/voidwire-app/voidwire-mailbox:unreleased
    network_mode: host
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
      relay:
        condition: service_started
    environment:
      RUST_LOG: "off"
      VOIDWIRE_MAILBOX_CONFIG: /data/mailbox.toml
    volumes:
      - ./config:/config:ro
      - ./data/mailbox:/data
    logging:
      driver: none
