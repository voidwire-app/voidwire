# voidwire-mailbox config for the container. Edit relay_url.
ip_transports = false
relay_url = "https://relay.example.com"   # the public https:// name of your relay

store_dir = "/data"
key_path = "/data/identity.key"           # keep this file; it is the mailbox ID

health_bind_addr = "127.0.0.1:48486"

appends_per_min = 20
append_burst = 20

max_relay_file_bytes = 26214400           # 25 MiB; 0 = up to 2 GiB

inbox_max_items = 16                      # 1-256
inbox_ttl_secs = 3600
inbox_max_total_bytes = 33554432

per_ip_reads_per_min = 60
per_ip_appends_per_min = 30

# Access token (docs/self-host-relay.md §4): created on first start, shared
# with the relay. No file (open relay) means no token.
relay_token_file = "/config/relay-token"

log = "off"
