# voidwire-mailbox config for the container. See docs/self-host-relay.md.
#
# You don't need this file for a basic setup: the setup service builds the
# mailbox config from .env. To control every setting, copy it and edit:
#   cp config/mailbox.example.toml config/mailbox.toml
# If config/mailbox.toml exists, it is used as it is and the mailbox
# settings in .env are ignored.
ip_transports = false
relay_url = "https://relay.example.com"   # the public https:// name of your relay

# true when UDP 7842 isn't reachable (mode B, or not forwarded): the relay
# link printed by --print-relay-link then tells the apps not to try it.
relay_link_no_udp = false

store_dir = "/data"
key_path = "/data/identity.key"           # keep this file; it is the mailbox ID

health_bind_addr = "127.0.0.1:48486"

appends_per_min = 20
append_burst = 20

max_relay_file_bytes = 26214400           # 25 MiB; 0 = up to 2 GiB

inbox_max_items = 16                      # 1-256
inbox_ttl_secs = 3600
inbox_max_total_bytes = 33554432

per_ip_reads_per_min = 60
per_ip_appends_per_min = 30

# Access token (docs/self-host-relay.md §4): created on first start, shared
# with the relay. No file (open relay) means no token.
relay_token_file = "/config/relay-token"

log = "off"
