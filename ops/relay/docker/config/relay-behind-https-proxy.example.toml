# iroh-relay config, mode B: an HTTPS-terminating reverse proxy (with
# WebSocket support) in front. The relay speaks plain HTTP on
# 127.0.0.1:3340 and must only be reachable from the proxy. UDP 7842 is not
# possible in this mode. See docs/self-host-relay.md.
#
# You don't need this file for a basic setup: set
# VOIDWIRE_RELAY_MODE=proxy in .env instead. To control every setting:
#   cp config/relay-behind-https-proxy.example.toml config/relay.toml
# and set relay_link_no_udp = true in the mailbox config. If
# config/relay.toml exists, the relay settings in .env are ignored.
enable_relay = true
http_bind_addr = "127.0.0.1:3340"     # proxy on another host: its LAN address, and firewall it
enable_quic_addr_discovery = false
enable_metrics = false
# Only devices with your relay link (token from config/relay-token, created
# on first start; leave the placeholder as it is).
access.shared_token = ["@RELAY_TOKEN@"]
# Open relay instead: replace the line above with  access = "everyone"

[limits]
accept_conn_limit = 50.0
accept_conn_burst = 200

[limits.client.rx]
bytes_per_second = 1048576
max_burst_bytes = 4194304
