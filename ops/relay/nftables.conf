#!/usr/sbin/nft -f
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    meta l4proto icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
    meta l4proto ipv6-icmp icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    tcp dport 443 accept                                   # iroh-relay HTTPS/WebSocket + ACME TLS-ALPN-01
    udp dport 7842 accept                                  # iroh-relay QUIC address discovery
    # no inbound admin port: outbound-only admin tunnels match 'established'
    tcp dport 80 reject with tcp reset                     # fast-fail captive probe (§3.2)
    # everything else: dropped, not logged (privacy rule)
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
