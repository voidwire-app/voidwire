[package]
name = "voidwire-mailbox"
description = "Relay-only blind encrypted revocation mailbox daemon (M2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
name = "voidwire_mailbox"
path = "src/lib.rs"

[[bin]]
name = "voidwire-mailbox"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
voidwire-core = { path = "../core", features = ["net"] }
zeroize = "1.8"

[dev-dependencies]
voidwire-core = { path = "../core", features = ["test-util", "net"] }
